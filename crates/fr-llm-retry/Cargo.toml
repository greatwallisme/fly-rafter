[package]
name = "fr-llm-retry"
description = "Fly Rafter provider-routed retry executor plugin: the dsh llm-retry twin riding the agent/request-error waterfall"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# Zero doctests in this crate; the harness's empty doctest stage trips the
# cargo uplift race on the `cdylib, rlib` dependency's unhashed rlib path
# (E0463 with 0 tests to run). Skipping the empty stage loses nothing.
doctest = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

# rlib faces only: the wire vocabulary stays single-sourced in the owner
# crates (the tools_client judgment — wire DTOs of a boundary never get
# local copies).
# - fr-wire: the durable `Failure` facts the retry event carries verbatim.
# - fr-llm: the `RetryPolicy` the provider route declares plus its wire
#   form and the single-sourced backoff math.
fr-wire = { workspace = true }
fr-llm = { workspace = true }

# Kernel family edge for the C-ABI dylib artifact (PRD 4.5): the plugin
# shell links only dougong-abi across the kernel boundary.
dougong-abi = { workspace = true }

[lints]
workspace = true
