[package]
name = "fr-tools-builtin"
description = "Fly Rafter built-in model tools (dsh tool-bash + tool-pwsh + shell-env + working-directory parity; the 16a shell-group slice of the builtin-tools contract)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dougong-abi.workspace = true
encoding_rs = "0.8"
fr-net = { version = "0.1.0", path = "../fr-net" }
fr-sandbox.workspace = true
fr-session.workspace = true
fr-wire.workspace = true
html-to-markdown-rs = { version = "3.19.1", default-features = false }
jiff = { version = "0.2", features = ["static"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url = "2"
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true

[dev-dependencies]
image.workspace = true
