[package]
name = "fr-headless"
description = "Fly Rafter headless entry plugin: the headless-startup facts face (the runner faces arrive with the Phase 18 runner slices)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true

# rlib faces only: the runner's typed inputs stay single-sourced in their
# provider crates (the tools_client judgment — wire DTOs of consumed
# services never get local copies; PRD 8.1 injects the matching services).
# - fr-wire: the durable session event envelope the `--json` projection
#   folds and the adoption checks read.
# - fr-agent-loop: the `agent/assistant-stream` frame vocabulary published
#   by the consumed 'agent' service.
# - fr-schema: the eight `--json` frame schema documents the projection's
#   output contract is pinned against.
fr-agent-loop = { workspace = true }
fr-schema = { workspace = true }
fr-wire = { workspace = true }

# Kernel family edge for the C-ABI dylib artifact (PRD 4.5): the plugin
# shell links only dougong-abi across the kernel boundary.
dougong-abi = { workspace = true }

[lints]
workspace = true
