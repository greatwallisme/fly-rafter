[package]
name = "fr-llm-anthropic"
description = "Fly Rafter Anthropic provider: the anthropic-messages wire protocol over hand-declared provider routes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Kernel family edge for the C-ABI dylib artifact (PRD 4.5): the plugin
# shell links only dougong-abi across the kernel boundary.
dougong-abi = { workspace = true }
# Shared LLM vocabulary: error codes, retry-policy input, and the frozen
# policy (fr-llm; deepseek/openai-crate precedent).
fr-llm.workspace = true
# Transport seam (Q77-A): the Fetch contract the execution shell posts
# through; the production ureq backend stays inside fr-net.
fr-net.workspace = true
# Attachment seam (Q78-A): the durable request-image reads the image
# preparation resolves through.
fr-attachment.workspace = true
# Idle watchdog of the streaming read loop (dsh `LLM_STREAM_IDLE_TIMEOUT`).
fr-timeout.workspace = true
# The stream face the worker channel exposes (deepseek-crate precedent).
futures-core = "0.3"
# Safe-integer gate and failure/finish vocabulary (fr-wire ids).
fr-wire.workspace = true
# Overflow pattern family (pi-ai utils/overflow.ts; regex is already in
# the workspace lock graph via fr-llm).
regex.workspace = true
serde_json.workspace = true

[lints]
workspace = true
