[workspace]
resolver = "3"
members = [
    "crates/fr",
    "crates/fr-config",
    "crates/fr-schema",
    "crates/fr-wire",
    "crates/fr-timeout",
    "crates/fr-net",
    "crates/fr-attachment",
    "crates/fr-session",
    "crates/fr-llm",
    "crates/fr-llm-deepseek",
    "crates/fr-llm-openai",
    "crates/fr-llm-anthropic",
    "crates/fr-agent-loop",
    "crates/fr-system-prompt",
    "crates/fr-tools",
    "crates/fr-guard-repeat-reminder",
    "crates/fr-guard-timeout",
    "crates/fr-approval",
    "crates/fr-permission-presets",
    "crates/fr-sandbox",
]

[workspace.package]
version = "0.1.0"
description = "Fly Rafter wire shape library"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greatwallisme/fly-rafter"
readme = "README.md"
keywords = ["agent", "ai", "plugin-system", "cli"]
categories = ["development-tools"]

[workspace.dependencies]
dougong = "0.4.0"
dougong-abi = "0.4.0"
dougong-dylib = "0.4.0"
dougong-loader = "0.4.0"
libc = "0.2"
zstd = "0.14"
zstd-safe = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
serde_yaml_ng = "0.10"
regex = "1.13"
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.10.9"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
# Slice 4 facility rulings (PRD decision 41): ureq blocking client (rustls
# default), image codecs, and libwebp advanced API (method=0 ladder effort).
ureq = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libwebp-sys = "0.9"

# Internal crates
fr-config = { path = "crates/fr-config" }
fr-llm = { path = "crates/fr-llm" }
fr-schema = { path = "crates/fr-schema" }
fr-wire = { path = "crates/fr-wire" }
fr-session = { path = "crates/fr-session" }
fr-timeout = { path = "crates/fr-timeout" }
fr-net = { path = "crates/fr-net" }
fr-attachment = { path = "crates/fr-attachment" }
fr-system-prompt = { path = "crates/fr-system-prompt" }
fr-agent-loop = { path = "crates/fr-agent-loop" }
fr-tools = { path = "crates/fr-tools" }
fr-guard-repeat-reminder = { path = "crates/fr-guard-repeat-reminder" }
fr-guard-timeout = { path = "crates/fr-guard-timeout" }

# Lint table aligned with the dougong workspace (PRD 21): the zero-warning
# gates (fmt / clippy -D warnings / test / doc) must stay reproducible.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "allow"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
multiple_crate_versions = "allow"
literal_string_with_formatting_args = "allow"
